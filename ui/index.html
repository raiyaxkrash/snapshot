<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SnapShot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="dim-badge" id="dimBadge" hidden>0 × 0</div>

  <div class="toolbar" id="toolbar" hidden>
    <div class="group">
      <button type="button" class="tbtn active" data-tool="arrow" title="Стрелка">
        <svg viewBox="0 0 24 24"><path d="M6 18 18 6M10 6h8v8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="tbtn" data-tool="rect" title="Рамка">
        <svg viewBox="0 0 24 24"><rect x="4.5" y="5.5" width="15" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.9"/></svg>
      </button>
      <button type="button" class="tbtn" data-tool="pen" title="Карандаш">
        <svg viewBox="0 0 24 24"><path d="M15.5 5.5 18.5 8.5 8.5 18.5H5.5v-3L15.5 5.5Z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="tbtn" data-tool="blur" title="Размытие / скрыть пароль">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1" fill="currentColor" opacity=".85"/><rect x="14" y="4" width="6" height="6" rx="1" fill="currentColor" opacity=".4"/><rect x="9" y="9" width="6" height="6" rx="1" fill="currentColor" opacity=".6"/><rect x="4" y="14" width="6" height="6" rx="1" fill="currentColor" opacity=".4"/><rect x="14" y="14" width="6" height="6" rx="1" fill="currentColor" opacity=".85"/></svg>
      </button>
      <button type="button" class="tbtn" id="beautifyBtn" data-a="beautify" title="Beautify: градиентный фон и тень">
        <svg viewBox="0 0 24 24"><path d="M12 3.5 13.9 9.1 19.5 11l-5.6 1.9L12 18.5l-1.9-5.6L4.5 11l5.6-1.9L12 3.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M18.5 16.5v3M17 18h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <button type="button" class="tbtn" data-a="undo" title="Отменить (Ctrl+Z)">
        <svg viewBox="0 0 24 24"><path d="M9 7 4.5 11.5 9 16M5 11.5h9a5 5 0 0 1 0 10h-2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <span class="sep"></span>
    <div class="group colors" id="colors">
      <button type="button" class="cdot active" data-color="#ff375f"></button>
      <button type="button" class="cdot" data-color="#ff9f0a"></button>
      <button type="button" class="cdot" data-color="#30d158"></button>
      <button type="button" class="cdot" data-color="#0a84ff"></button>
      <button type="button" class="cdot" data-color="#ffffff"></button>
    </div>
    <span class="sep"></span>
    <div class="group">
      <button type="button" class="abtn ocr-btn" data-a="ocr" title="Распознать текст (OCR)">OCR</button>
      <button type="button" class="abtn" data-a="save" title="Сохранить в Pictures\SnapShot (Ctrl+S)">Сохранить</button>
      <button type="button" class="abtn primary" data-a="copy" title="Копировать в буфер (Enter / Ctrl+C)">Копировать</button>
      <button type="button" class="tbtn" data-a="cancel" title="Отмена (Esc)">
        <svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <div class="hint" id="hint">Выделите область мышью · Esc — отмена</div>
  <script src="app.js"></script>
</body>
</html>
