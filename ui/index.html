<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SnapShot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="dim-badge" id="dimBadge" hidden>0 × 0</div>

  <div class="toolbar" id="toolbar" hidden>
    <div class="group">
      <button type="button" class="tbtn active" data-tool="arrow" title="Стрелка" aria-label="Стрелка">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18 18 6M10 6h8v8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="tbtn" data-tool="rect" title="Рамка" aria-label="Рамка">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
      <button type="button" class="tbtn" data-tool="pen" title="Карандаш" aria-label="Карандаш">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 4.5 19.5 8 8.5 19H5v-3.5L16 4.5Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="tbtn" data-tool="blur" title="Размытие" aria-label="Размытие">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="14" y="4" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 2"/><rect x="4" y="14" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 2"/><rect x="14" y="14" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </div>
    <span class="sep" aria-hidden="true"></span>
    <div class="group">
      <button type="button" class="tbtn" id="beautifyBtn" data-a="beautify" title="Студийная рамка" aria-label="Студийная рамка">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="7" y="8" width="10" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
      <button type="button" class="tbtn" data-a="undo" title="Отменить (Ctrl+Z)" aria-label="Отменить">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7 4 12l5 5M4 12h11a4 4 0 0 1 0 8h-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <span class="sep" aria-hidden="true"></span>
    <div class="group colors" id="colors" role="radiogroup" aria-label="Цвет разметки">
      <button type="button" class="cdot active" data-color="#e5484d" aria-label="Красный"></button>
      <button type="button" class="cdot" data-color="#e59a3c" aria-label="Янтарный"></button>
      <button type="button" class="cdot" data-color="#4cc38a" aria-label="Зелёный"></button>
      <button type="button" class="cdot" data-color="#3b82f6" aria-label="Синий"></button>
      <button type="button" class="cdot" data-color="#ededed" aria-label="Белый"></button>
    </div>
    <span class="sep" aria-hidden="true"></span>
    <div class="group">
      <button type="button" class="abtn" data-a="ocr" title="Распознать текст (OCR)">OCR</button>
      <button type="button" class="abtn" data-a="save" title="Сохранить (Ctrl+S)">Сохранить</button>
      <button type="button" class="abtn primary" data-a="copy" title="Копировать (Enter)">Копировать</button>
      <button type="button" class="tbtn" data-a="cancel" title="Закрыть (Esc)" aria-label="Закрыть">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <div class="hint" id="hint"><span>Выделите область</span><kbd>Esc</kbd><span>отмена</span></div>
  <script src="app.js"></script>
</body>
</html>
